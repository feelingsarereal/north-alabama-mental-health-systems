  summary: 'CDC''s model-based estimates of health measures for every census tract in the country, 2025 release, retrieved from data.cdc.gov on 4 October 2026 for the 117 tracts of Madison and Cullman counties. The dataset''s own description says the estimates are model-based and draw on the 2023 Behavioral Risk Factor Surveillance System (2022 for five measures), 2020 census population counts and American Community Survey estimates. Ten crude-prevalence measures for adults were taken: depression, frequent mental distress, loneliness, lack of social and emotional support, food insecurity, housing insecurity, lack of reliable transportation, no health insurance at ages 18 to 64, binge drinking, and fair or poor self-rated health. They are modeled values, not counts or survey results for each tract. They supply tract layers of the regional map and are not used in the report''s text.'
