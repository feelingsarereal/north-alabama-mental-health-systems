  citation: WellStone, Inc. (filed with the Alabama Department of Mental Health). WellStone Strategic Plan Fiscal Years 2026-2027. 2025-11-18.
  title: WellStone Strategic Plan Fiscal Years 2026-2027
  publisher: WellStone, Inc. (filed with the Alabama Department of Mental Health)
  published: '2025-11-18'
  url: https://mh.alabama.gov/wp-content/uploads/2026/01/WellStone-Behavioral-Health.pdf
  year: 2025
  summary: WellStone's two-year strategic plan as submitted to its Board of Directors on 18 November 2025 and posted on the ADMH website in January 2026. It states how many people WellStone served in FY2025, names its three greatest unmet needs (housing, medication funding for adults with no third-party payer, nursing recruitment and retention) and sets a target that 75% of therapists be evidence-based certified by 30 September 2026. The reader found no mention of an electronic health record, telehealth, transportation or CARF/Joint Commission accreditation in it.
  why_it_mattered: The one current document in which WellStone states its own service area, how many people it served and what it cannot yet provide. More blocks of this report rest on it than on any other source, and the unmet needs it names (housing, medication funding, nursing) recur in later sections.
