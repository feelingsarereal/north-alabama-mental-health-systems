  short: A clinic certified to provide a required set of mental health and substance use services to anyone who seeks care, and paid a daily rate by Medicaid. WellStone has been one since July 2024.
  definition: 'A Certified Community Behavioral Health Clinic follows a federal clinic model: it must provide nine required services, among them round-the-clock crisis response and primary care screening, and Medicaid pays it a daily rate in place of fee-for-service [397]. Alabama''s manual requires a clinic to provide the full array of services to everyone seeking care, regardless of ability to pay [373]. The state certified WellStone effective July 2024, and WellStone describes itself as one of the first two Alabama clinics in the Medicaid demonstration [42] [119]. The Department of Mental Health''s directory lists full-scope clinic sites at WellStone''s Huntsville and Cullman campuses and at Mountain Lakes'' offices in Guntersville and Scottsboro [5]. The Department counts 13,700 people served by WellStone as a clinic in fiscal year 2025 [64].'
