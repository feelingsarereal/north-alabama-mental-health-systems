- id: open-items
  term: Open items
  kind: methods
  category: concept
  variants:
  - Open Items
  - open items
  short: The list of things this report could not read, confirm or find, each with where it was looked for and what would settle it.
  definition: 'The open items are the report''s record of what it could not settle: documents that would not open, figures that need a person to read them by eye, announcements whose outcome could not be confirmed, and counts that were looked for and not found. Appendix C prints the principal ones and the Open Items page lists them all, with where each was looked for. An open item says the thing was not found in the sources read; it does not say the thing does not exist.'
