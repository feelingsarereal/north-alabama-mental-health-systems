  definition: The Department of Mental Health describes its crisis centers as open around the clock to people who walk in and to those brought by law enforcement, first responders or emergency medical crews [3]. Alabama has six, and the Department's map shows seven counties covered by none [3] [7]. The Huntsville center, run by WellStone, was one of the first three the state named, on 28 October 2020, from an $18 million appropriation [32]. The state's evaluation office reported in 2025 that each of the six centers was funded at $7,000,000 a year; it found the centers' monthly reports inconsistent and published no count of jail or emergency room avoidance for any single center [62].
