- id: claims-ledger
  term: Claims ledger
  kind: methods
  category: concept
  variants:
  - claims ledger
  short: 'The record behind the report: every claim it makes, the passage that supports it, and whether it is verified, the report''s own analysis, or a statement that something was not found.'
  definition: The claims ledger lists each claim in the report with the words that state it, the source passage that supports it, and a status. A claim is verified against a quoted passage, or is the report's own analysis or arithmetic, or records that something was not found, or is a statement about the report itself. The reader shows these statuses on request, and a bracketed number in the text opens the supporting passage.
