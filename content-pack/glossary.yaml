  short: The nonprofit community mental health center for Madison and Cullman counties. It also runs the Huntsville crisis center, a 988 call center and a pediatric crisis unit.
  definition: 'WellStone is the community mental health center that the Department of Mental Health assigns to Madison and Cullman counties, and to no others; it also runs the Huntsville crisis center and pediatric crisis unit and one of Alabama''s four in-state 988 call centers [2] [3] [4]. It says it was incorporated in 1969 under Act 310 of 1967, was known for more than 25 years as the Mental Health Center of Madison County, and took the WellStone name in 2014 [1] [23]. The Cullman Area Mental Health Authority merged into it on 1 October 2017 [26]. An 18-member board governs it: six members appointed by the City of Huntsville, six by the Madison County Commission, three by the City of Cullman and three by the Cullman County Commission [1]. Its plan says it served over 12,000 people in the two counties in fiscal year 2025, and the Department''s tables for that year give 11,659 and 13,700 [1] [64].'
