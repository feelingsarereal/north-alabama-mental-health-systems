  term: Sequential Intercept Model
  kind: methods
  category: concept
  variants:
  - Sequential Intercept Model
  - intercepts
  - intercept
  short: A map of the six points, numbered 0 to 5, at which a person with mental illness can be turned from the criminal justice system toward treatment.
  definition: 'The model lays the justice system out as a path and marks six points on it, numbered 0 to 5: community services, law enforcement, initial detention and first court hearings, jails and courts, reentry, and community corrections [397]. Communities use it to find gaps and opportunities at each point, and the earlier the intercept, the less time a person spends in the justice system [397]. In this region Intercept 0 includes the Huntsville crisis center, to which law enforcement and first responders in fifteen counties can bring a person in crisis at any hour [397] [3]. As WellStone described it in April 2024, a Cullman County caller to 988 is connected to the Huntsville center, which connects them to a local crisis team [41].'
