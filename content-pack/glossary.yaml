  short: A Huntsville-area coalition of mental health stakeholders, formed in 2015 by a committee of the Society of St. Vincent de Paul.
  definition: The coalition was formed in 2015 by the Voice of the Poor Committee of the Society of St. Vincent de Paul in Huntsville, to improve the situation of people with serious mental illness, many of them homeless or in jail [25]. It describes itself as community mental health stakeholders who share knowledge and resources to find and address gaps in access to care [225]. Its listed core partners include WellStone, Huntsville Hospital, the sheriff's department, the Huntsville and Madison police, First Stop, the probate judges and Little Orange Fish [226]. In 2018 it asked the Huntsville City Council and the Madison County Commission to help fund WellStone's jail diversion program [27]. The statewide report names Little Orange Fish as its backbone organization, so where this report describes the coalition it is describing a body that the organization it was prepared for belongs to [397].
