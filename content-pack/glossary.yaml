  short: A camp for unsheltered people in Huntsville that the city manages. It was rebuilt after a 2024 fire with marked spaces and a perimeter fence.
  definition: The South Derrick Street Camp is a camp for unsheltered people managed by the City of Huntsville's Community Development department with providers from the homelessness continuum [318]. After a 2024 fire the city rebuilt it with an asphalt pad, 84 individual spaces with tents on platforms and a perimeter fence, and required occupants to register and sign community standards [318]. Press reports in 2026 gave its capacity as about 58 people, with around 30 to 35 staying there [319] [320]. People staying there must take part in case management, and the city said in June 2026 that its Homeless Services Team had helped 22 former residents into stable housing in six months [320] [321].
