  short: A place, population or facility the federal government has designated as short of mental health providers. Cullman County has one; Madison County has no area designation.
  definition: A Health Professional Shortage Area, or HPSA, is a designation by the federal health workforce agency that a geographic area, a population within an area, or a facility has too few providers [397]. For mental health the designation counts psychiatrists only, and the threshold is a population of at least 30,000 for each psychiatrist, or 20,000 where needs are unusually high [146] [147]. Cullman County is designated as a whole county for its low-income population, with a score of 16 [52]. Madison County has no current area designation and is the only Alabama county without one [52]. A designation is a gateway to federal help such as loan repayment for clinicians who work there [397].
