  short: The fixed amount Medicaid pays a certified clinic for each day it gives a Medicaid enrollee a qualifying service, whatever the service. It is not paid for people outside Medicaid.
  definition: '"Prospective" means the rate is fixed ahead of time from the clinic''s expected costs and is not billed item by item afterwards [397]. Under Alabama''s billing manual a clinic receives a single payment for each day on which at least one qualifying service is provided to a Medicaid enrollee [371]. Each clinic''s rate is rebuilt from its actual costs and visits after its second demonstration year and every three years after that [372]. The provider manual says the rate "will not be paid for services provided to populations outside of those enrolled in Medicaid" [57]. No daily rate for WellStone appears in its strategic plan [1].'
