  definition: 'The statewide report describes Alabama''s mental health system in eight domains and four cross-sector sections, and it supplies the frame used in this report [397]. Six of the domains follow the World Health Organization''s building blocks of a health system: service delivery, health workforce, health information systems, access to essential medicines, financing, and leadership and governance [397]. The statewide report adds two domains of its own, on equity and on community engagement, and four further sections on children, justice, social determinants and payers [397].'
