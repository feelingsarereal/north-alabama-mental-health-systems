  definition: 988 is the national number for a mental health or suicide crisis, reachable by call, text or chat at any hour [397]. Alabama has four in-state call centers, in Mobile, Birmingham, Dothan and Huntsville, and the Huntsville one is at WellStone [4]. The Department of Mental Health's page publishes no list of the counties each center answers; WellStone said in April 2024 that a Cullman County caller reaches the Huntsville center, which connects the caller to a local crisis team [4] [41]. The Department's table for fiscal year 2025 gives the WellStone center 6,627 of a four-center total of 35,118, and the Department gave it $660,000 of opioid settlement money to expand staffing and hours [64] [45].
