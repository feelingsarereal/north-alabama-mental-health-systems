  definition: 'The point-in-time count is a count of everyone found homeless, in shelters and on the street, on a single night in January, which federal rules require each continuum of care to conduct [397]. It is a snapshot that depends on weather and on how many volunteers search, and it is better for rough scale than for year-to-year change [397]. The federal report of the count of 28 January 2025 for the Huntsville continuum gives 718 people: 416 in emergency shelter, 37 in transitional housing and 265 unsheltered [60]. The number listed as severely mentally ill has moved erratically, from 71 in 2022 to 24 in 2023, 40 in 2024 and 49 in 2025 [59] [313] [314] [60].'
