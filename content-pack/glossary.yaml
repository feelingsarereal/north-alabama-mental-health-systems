- id: cdc-places
  term: CDC PLACES
  kind: statistics
  category: data-source
  variants:
  - PLACES
  short: A federal dataset of modeled health estimates for counties, cities and census tracts. Its tract values are produced by a model, not by surveying each tract.
  definition: PLACES is the Centers for Disease Control and Prevention's set of model-based estimates of health measures for every census tract in the country [407]. The dataset's own description says the estimates draw on the 2023 Behavioral Risk Factor Surveillance System, 2020 census population counts and American Community Survey estimates [407]. Ten of its measures for adults supply tract layers of the regional map; they are modeled values, not counts or survey results for each tract [407].
