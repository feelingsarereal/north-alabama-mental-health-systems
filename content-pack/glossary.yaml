  short: Medicaid's term for a psychiatric facility of more than 16 beds, where it usually will not pay for adults aged 21 to 64. Alabama's waiver covers such stays only in Baldwin and Mobile counties.
  definition: An institution for mental disease is a hospital, nursing facility or other institution of more than 16 beds that mainly provides care for mental illness, and Medicaid has historically not paid for care in one for people aged 21 to 64 [397]. A state can obtain a federal waiver of that rule; Alabama's, approved from 20 May 2022 to 19 May 2027, pays for stays of enrollees aged 21 to 64 only in institutions in Baldwin and Mobile counties [370]. Enrollees from any county may use those institutions, and no north Alabama facility is covered [370]. A separate Medicaid rule covers inpatient psychiatric services for recipients under 21 [369].
