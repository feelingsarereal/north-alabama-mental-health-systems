  short: Court-ordered treatment in the community for a person who has been through the commitment process; in Madison County, run by the probate court with WellStone since 2020.
  definition: Assisted outpatient treatment is court-ordered outpatient care for people with severe mental illness who can live safely in the community with treatment and have had trouble staying in it voluntarily [30]. Madison County's probate court announced its program with WellStone, to start on 3 February 2020, paying for it at first from the passport application fees the court collects [30]. A person enters only after a commitment petition, an assessment, a physician's confirmation that outpatient care is appropriate, a written treatment plan and a hearing [30]. As designed, participants have a case manager and a therapist and report every 30 days for up to 150 days [79]. A federal grant of $3,099,656 to WellStone, with the probate court and Huntsville Hospital as named partners, ran from 31 July 2022 to 30 July 2026 and set a target of 275 people enrolled [37].
