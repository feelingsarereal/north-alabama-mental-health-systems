  snowball:
  - from index pages (agency document lists, newsroom tag pages, budget pages) to the documents they link
  - from a press report to the primary document it refers to
  - from the statewide pack's references to their local passages
  inclusion:
  - the publisher's own document or data wherever one could be read
  - reputable press only where no primary document was reachable, and labeled as such
  - a supporting passage recorded for every finding
  exclusion:
  - pages the reader could not open (recorded, never worked around)
  - archive or mirror copies of blocked pages
  - figures recalled from memory or estimated
  - names of private individuals from news reports
  known_gaps:
  - The search tool returns a page of results without a total, so hit counts are not available; every query is listed
    with what it was for.
  - 390 page reads failed across the two sweeps, most refused by a site's request limit or its robots rule. None
    was worked around; the principal ones are in the open items.
  - Most wellstone.com pages refused the page reader; WellStone's own description of its programs, locations and
    board is therefore under-read, and the report leans on documents WellStone filed with the state, federal award
    records and the press.
  - Sources were read through an automated page reader that returns extracts. Passages are as it returned them;
    paraphrases are flagged, and tables it returned inconsistently are listed under 'Needs a human eye'.
  - 'Census, CDC, HRSA and County Health Rankings data sites are not reachable from the research environment. County
    figures come from the statewide pack''s checked table. Tract-level map data was retrieved on 4 October 2026
    through the browser on the builder''s own computer and checked against checksums computed in the browser (geo/raw/checks.md).
    Tract boundaries are not in the pack: the app fetches the Census Bureau''s boundary file when it is built.'
  - Service locations on the map were placed by geocoding the addresses printed in the sources. Two could not be
    placed, and WellStone's Huntsville campus is placed from a federal treatment locator whose two records for the
    address disagree; geo/NOTES.md lists every such case.
