topic: 'The mental health system of systems in North Alabama: WellStone''s service area (Madison and Cullman counties
  in depth; the fifteen-county Huntsville crisis-center catchment in outline), as a regional edition of the Alabama
  Mental Health Systems Report.'
question: What does the mental health system of systems look like in WellStone's service area in October 2026 (who
  decides, who pays, what exists, who delivers it, who is reached and who is missed) in Madison and Cullman counties,
  and how does the wider fifteen-county crisis catchment depend on it?
purpose: orientation
boundary:
  in:
  - Madison County and Cullman County, Alabama, researched in depth across the statewide report's eight domains
    and four cross-sector sections
  - the fifteen-county catchment of the Huntsville crisis center as map frame and comparison ring, with a short
    profile of each of the four other community mental health centers serving it
  - ADMH Region 1 and Alabama as benchmarks only
  - census-tract map layers for Madison and Cullman; county layers for the ring; a point layer of service locations
  - 'public sources only: agency documents and data, budgets, court records, organizations'' own published reports,
    and reputable press where no primary document could be read'
  - the statewide pack's checked references, county data and local passages, re-read for the regional claims
  out:
  - 'documents supplied privately by WellStone or any other provider: the report is independent and WellStone is
    a subject, not a partner'
  - Little Orange Fish's own publications and North Alabama Mental Health Coalition meeting recaps or minutes as
    sources of fact
  - separate research into the courts, jails, schools, housing or hospitals of the thirteen ring counties beyond
    their center profiles and map layers
  - state-level facts already established in the statewide report, except as benchmarks
  - 're-analysis of any dataset: values are shown as published, and anything computed is labeled as derived'
  - named private individuals from news reports
  - clinical guidance and policy advocacy, as in the statewide report
  rationale: 'Daniel chose the nested boundary on 4 October 2026: WellStone is the center and CCBHC for two counties
    but its crisis center takes people from fifteen, so the two counties carry the depth and the fifteen carry the
    map.'
level: 'regional system: two counties in depth, tracts within them, fifteen counties in outline'
time_window:
  current_from: 2021
  seminal: founding dates, closures, statutes and litigation of any age where the present depends on them
stance: primer-with-controversies
depth: deep
target_words: 25000
frame: the statewide report's eight domains and four cross-sector sections, so the two sites read as a pair
anchors:
- citation: 'Little Orange Fish. Alabama Mental Health Systems Report, v261003.1 (checked draft of 3 October 2026):
    references, county data and local passages.'
  why: Daniel selected the statewide pack as the one source to draw on beyond the public record; that report names
    'a planned North Alabama regional edition built on the same template'.
- citation: WellStone, Inc. Strategic Plan, Fiscal Years 2026-2027 (approved 18 November 2025), filed with the Alabama
    Department of Mental Health.
  url: https://mh.alabama.gov/wp-content/uploads/2026/01/WellStone-Behavioral-Health.pdf
  why: The one current primary document in which WellStone states its own service area, numbers served and unmet
    needs.
excluded:
- what: Published NAMHC meeting recaps and the NAMHC minutes compilation
  why: Offered at the interview and not selected.
- what: Documents supplied by Daniel
  why: Offered at the interview and not selected; none supplied.
assumed: false
outline_approved: '2026-10-04'
interview:
- q: How should the North Alabama site be delivered?
  answer: Same as statewide (public GitHub Pages under the feelingsarereal account with Little Orange Fish branding,
    marked 'Draft for review' until approved)
  asked: '2026-10-04'
- q: What is the site mainly for?
  answer: Regional systems report (the statewide report's eight-domain analysis redone at regional scale)
  asked: '2026-10-04'
- q: How does WellStone itself relate to this project?
  answer: Independent, public sources only
  asked: '2026-10-04'
- q: Add this pack's references to your Zotero library?
  answer: 'No'
  asked: '2026-10-04'
- q: Which map is the report about?
  answer: 'Nested: two-county core, 15-county ring'
  asked: '2026-10-04'
- q: How should the report be organised?
  answer: Same eight domains as statewide
  asked: '2026-10-04'
- q: How fine should the regional map go?
  answer: Census tracts in the core, counties in the ring
  asked: '2026-10-04'
- q: How deep should the written report go?
  answer: 'Full report scale: ~25,000 words'
  asked: '2026-10-04'
- q: Beyond the public record, which of these should I draw on?
  answer: The statewide pack
  asked: '2026-10-04'
- q: Is there anything the report should keep out?
  answer: 'Nothing: same scope as statewide'
  asked: '2026-10-04'
- q: What should the site be called?
  answer: North Alabama Mental Health Systems Report
  asked: '2026-10-04'
- q: Whose name goes on it?
  answer: Little Orange Fish, prepared with Claude
  asked: '2026-10-04'
