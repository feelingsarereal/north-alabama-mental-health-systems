plain_abstract: 'WellStone is the public mental health center for Madison and Cullman counties, and its crisis center
  in Huntsville is assigned people from fifteen. This report describes the system around it in one place: who governs
  and pays, what services exist, who staffs them, what is measured, who is reached and who is missed, and how schools,
  courts, jails, housing and insurers shape the result. It follows the eight domains and four cross-sector sections
  of the statewide Alabama Mental Health Systems Report, applied to two counties in depth and to the thirteen surrounding
  counties in outline. It was researched and written with Claude from public sources only, and every sentence was
  read back against the passage that supports it. You can read the report with each sentence''s source one hover
  away and see what could not be read, confirmed or found. It is a draft for review, independent of WellStone, and
  not an approved or peer-reviewed publication.'
