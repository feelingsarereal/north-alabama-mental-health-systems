    <meta name="theme-color" content="#e8762b" />
    <script>
      // theme before first paint: stored choice, else the system preference (DESIGN-SYSTEM §5)
      try {
        var t = localStorage.getItem('bx-theme:north-alabama-mental-health-systems');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>

    <div id="root"></div>
